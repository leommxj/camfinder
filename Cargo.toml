[package]
name = "camfinder"
version = "0.1.0"
edition = "2021"

[features]
default = []
soapy = ["dep:soapysdr"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3.5"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rs-spy = "0.4.1"
rustfft = "6.4"
soapysdr = { version = "0.5.1", optional = true, default-features = false }
