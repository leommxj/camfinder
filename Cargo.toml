[package]
name = "camfinder"
version = "0.1.1"
edition = "2021"
authors = ["leommxj"]
license = "WTFPL"

[workspace]
members = ["apps/terminal", "apps/cardputer-zero", "xtask"]
default-members = [".", "apps/terminal"]
exclude = ["vendor/rs-spy"]
resolver = "2"

[features]
default = ["airspy"]
airspy = ["dep:rs-spy"]
soapy = ["dep:soapysdr"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rs-spy = { version = "=0.4.1", optional = true }
rustfft = "6.4"
soapysdr = { version = "0.5.1", optional = true, default-features = false }

[patch.crates-io]
rs-spy = { path = "vendor/rs-spy" }
