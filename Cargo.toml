[package]
name = "camfinder"
version = "0.1.0"
edition = "2021"
authors = ["leommxj"]
license = "WTFPL"
default-run = "camfinder"

[workspace]
members = ["apps/cardputer-zero", "xtask"]
default-members = ["."]
exclude = ["vendor/rs-spy"]
resolver = "2"

[[bin]]
name = "camfinder"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "tui", "airspy"]
cli = ["dep:clap", "dep:ctrlc", "tui"]
tui = ["dep:crossterm", "dep:ratatui"]
airspy = ["dep:rs-spy"]
soapy = ["dep:soapysdr"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.28", optional = true }
ctrlc = { version = "3.5", optional = true }
ratatui = { version = "0.29", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rs-spy = { version = "=0.4.1", optional = true }
rustfft = "6.4"
soapysdr = { version = "0.5.1", optional = true, default-features = false }

[patch.crates-io]
rs-spy = { path = "vendor/rs-spy" }
