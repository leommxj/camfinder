name = "best_high_airspy"
offset_model = "ppm"
min_hits = 3
min_score = 20.0
max_offset_spread_hz = 1200.0

[[groups]]
name = "24mhz"
freqs_mhz = [792.0, 816.0, 840.0, 864.0]

[[groups]]
name = "27mhz"
freqs_mhz = [810.0, 864.0, 918.0, 945.0]

[scan]
peak_search_window_hz = 250000.0
min_peak_snr_db = 4.0
max_peaks_per_freq = 12
record_spectrum_bins = 128
record_band_decimation = 1
output = "tui"

[device]
backend = "airspy"

[device.airspy]
device_index = 0
sample_rate_hz = 3000000
dwell_ms = 300
fft_size = 65536
dc_notch_hz = 2000.0
settle_ms = 40

[device.airspy.gain]
mode = "manual"
preset = 18
lna = 15
mixer = 15
vga = 2
lna_agc = false
mixer_agc = false
