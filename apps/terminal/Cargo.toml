[package]
name = "camfinder-terminal"
version = "0.1.0"
edition = "2021"
authors = ["leommxj"]
license = "WTFPL"
default-run = "camfinder"

[[bin]]
name = "camfinder"
path = "src/main.rs"

[features]
default = ["airspy"]
airspy = ["camfinder/airspy"]
soapy = ["camfinder/soapy"]

[dependencies]
camfinder = { path = "../..", default-features = false }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3.5"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
