[package]
name = "camfinder-cardputer-zero"
version = "0.1.1"
edition = "2021"
authors = ["leommxj"]
license = "WTFPL"

[features]
default = ["airspy"]
airspy = ["camfinder/airspy"]
soapy = ["camfinder/soapy"]

[dependencies]
anyhow = "1"
ctrlc = "3.5"
camfinder = { path = "../..", default-features = false }
sdl2 = { version = "0.38", features = ["ttf"] }
serde_json = "1"
png = "0.17"
