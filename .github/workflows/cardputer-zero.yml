name: CardputerZero package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build and runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev fonts-dejavu-core
      - name: Build application
        run: cargo build --locked --release --package camfinder-cardputer-zero --target aarch64-unknown-linux-gnu
      - name: Capture application demo
        env:
          SDL_VIDEODRIVER: dummy
        run: target/aarch64-unknown-linux-gnu/release/camfinder-cardputer-zero --demo --duration 2 --page scan --screenshot target/camfinder-screenshot.png
      - name: Build Debian package
        run: cargo xtask cardputer-zero --no-build --screenshot target/camfinder-screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: camfinder-cardputer-zero-arm64
          path: target/dist/
